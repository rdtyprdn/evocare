name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # composer.lock memakai Symfony 8 yang butuh PHP 8.4.1 atau lebih baru.
        php: ['8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, gd, zip, pdo, pdo_sqlite, sqlite3, intl, bcmath
          coverage: none

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependensi PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build aset (manifest Vite dibutuhkan tampilan saat tes)
        run: |
          npm ci
          npm run build

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Jalankan tes
        run: php artisan test
